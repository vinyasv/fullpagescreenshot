<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pagecraft capture fixture</title>
<style>
  body { margin: 0; font: 20px/1.5 system-ui; color: #252525; background: #f7f4ed; }
  header { position: sticky; top: 0; padding: 14px 24px; background: #252525; color: white; z-index: 2; }
  section { min-height: 560px; padding: 32px; border-bottom: 6px solid #e56142; }
  section:nth-child(even) { background: #e9e5dc; }
  .lazy { width: 480px; height: 180px; display: block; background: #ddd; }
  footer { padding: 50px; background: #302f2b; color: white; font-size: 34px; }
</style></head><body><header>Sticky header — should appear once</header>
<section><h1>First viewport</h1><p>Scroll down before capturing to test restoration.</p></section>
<section><h2>Second viewport</h2><div class="lazy" id="lazy">Lazy content pending</div></section>
<section><h2>Third viewport</h2><p>Check for duplicate or blank seams.</p></section>
<footer>END OF PAGE — capture must include this marker</footer>
<script>const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting) { document.querySelector('#lazy').textContent = 'LAZY CONTENT LOADED'; observer.disconnect(); } }); observer.observe(document.querySelector('#lazy'));</script>
</body></html>
